services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodata:/data/db
      # - "/home/mohamed/mongo-data:/data/db"

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}  #.envكده يقدرياخدالقيم بتاعتهم من 
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

      
    command: ["--bind_ip_all"]  

    networks:
      -  backend
    
    restart: always


networks:
  backend:

volumes:
  mongodata:
  



